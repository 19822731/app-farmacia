<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mostrador & Administración | Farmacia Torres</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-slate-100 text-slate-800 font-sans min-h-screen flex flex-col">

  <!-- Header -->
  <header class="bg-slate-900 text-white shadow sticky top-0 z-40">
    <div class="max-w-7xl mx-auto px-4 py-3 flex items-center justify-between">
      <div class="flex items-center space-x-3">
        <div class="w-8 h-8 rounded-lg bg-emerald-500 flex items-center justify-center font-bold text-white">
          <i data-lucide="activity" class="w-5 h-5"></i>
        </div>
        <div>
          <h1 class="text-lg font-bold leading-tight">Panel de Mostrador | Farmacia Torres</h1>
          <p class="text-xs text-slate-400">Gestión de Pedidos de WhatsApp & Inventario</p>
        </div>
      </div>

      <div class="flex items-center space-x-3">
        <a href="/" target="_blank" class="text-xs bg-slate-800 hover:bg-slate-700 text-slate-200 px-3 py-1.5 rounded-lg flex items-center space-x-1.5 transition">
          <i data-lucide="external-link" class="w-3.5 h-3.5"></i>
          <span>Ver Catálogo Web</span>
        </a>
        <button onclick="cargarTodo()" class="text-xs bg-emerald-600 hover:bg-emerald-500 text-white px-3 py-1.5 rounded-lg flex items-center space-x-1.5 transition shadow">
          <i data-lucide="refresh-cw" class="w-3.5 h-3.5"></i>
          <span>Actualizar</span>
        </button>
      </div>
    </div>
  </header>

  <!-- Container -->
  <main class="max-w-7xl mx-auto px-4 py-6 flex-1 w-full space-y-6">

    <!-- KPI Cards -->
    <div class="grid grid-cols-2 md:grid-cols-4 gap-4">
      <div class="bg-white p-4 rounded-2xl shadow-sm border border-slate-200 flex items-center justify-between">
        <div>
          <span class="text-xs font-semibold text-slate-400 uppercase">Pedidos Hoy</span>
          <h3 id="stat-total" class="text-2xl font-black text-slate-900">0</h3>
        </div>
        <div class="w-10 h-10 rounded-xl bg-blue-50 text-blue-600 flex items-center justify-center">
          <i data-lucide="shopping-bag" class="w-5 h-5"></i>
        </div>
      </div>

      <div class="bg-white p-4 rounded-2xl shadow-sm border border-slate-200 flex items-center justify-between">
        <div>
          <span class="text-xs font-semibold text-amber-500 uppercase">Pendientes</span>
          <h3 id="stat-pendientes" class="text-2xl font-black text-amber-600">0</h3>
        </div>
        <div class="w-10 h-10 rounded-xl bg-amber-50 text-amber-600 flex items-center justify-center">
          <i data-lucide="clock" class="w-5 h-5"></i>
        </div>
      </div>

      <div class="bg-white p-4 rounded-2xl shadow-sm border border-slate-200 flex items-center justify-between">
        <div>
          <span class="text-xs font-semibold text-emerald-500 uppercase">Listos p/ Retiro</span>
          <h3 id="stat-listos" class="text-2xl font-black text-emerald-600">0</h3>
        </div>
        <div class="w-10 h-10 rounded-xl bg-emerald-50 text-emerald-600 flex items-center justify-center">
          <i data-lucide="check-circle" class="w-5 h-5"></i>
        </div>
      </div>

      <div class="bg-white p-4 rounded-2xl shadow-sm border border-slate-200 flex items-center justify-between">
        <div>
          <span class="text-xs font-semibold text-slate-400 uppercase">Total en Mostrador</span>
          <h3 id="stat-facturado" class="text-2xl font-black text-slate-900">$0</h3>
        </div>
        <div class="w-10 h-10 rounded-xl bg-slate-100 text-slate-700 flex items-center justify-center">
          <i data-lucide="badge-dollar-sign" class="w-5 h-5"></i>
        </div>
      </div>
    </div>

    <!-- Pestañas de Navegación -->
    <div class="flex border-b border-slate-200 bg-white rounded-t-2xl px-4 pt-2">
      <button onclick="cambiarTab('pedidos')" id="tab-btn-pedidos" class="px-5 py-3 text-sm font-bold border-b-2 border-emerald-600 text-emerald-600 flex items-center space-x-2">
        <i data-lucide="list-ordered" class="w-4 h-4"></i>
        <span>Pedidos en Mostrador</span>
      </button>
      <button onclick="cambiarTab('inventario')" id="tab-btn-inventario" class="px-5 py-3 text-sm font-medium border-b-2 border-transparent text-slate-500 hover:text-slate-800 flex items-center space-x-2">
        <i data-lucide="pill" class="w-4 h-4"></i>
        <span>Gestión de Precios & Stock</span>
      </button>
      <button onclick="cambiarTab('b2b')" id="tab-btn-b2b" class="px-5 py-3 text-sm font-medium border-b-2 border-transparent text-slate-500 hover:text-slate-800 flex items-center space-x-2">
        <i data-lucide="building-2" class="w-4 h-4"></i>
        <span>Pedidos Droguería (B2B)</span>
      </button>
    </div>

    <!-- TAB 1: PEDIDOS -->
    <div id="tab-pedidos" class="space-y-4">
      <div id="grid-pedidos" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
        <!-- Tarjetas de pedidos dinámicas -->
      </div>
    </div>

    <!-- TAB 2: INVENTARIO -->
    <div id="tab-inventario" class="hidden bg-white p-6 rounded-b-2xl shadow-sm border border-slate-200 space-y-4">
      <div class="flex flex-col sm:flex-row justify-between items-center gap-3">
        <div class="relative w-full sm:w-80">
          <i data-lucide="search" class="w-4 h-4 absolute left-3 top-3 text-slate-400"></i>
          <input 
            type="text" 
            placeholder="Buscar por marca o droga..." 
            class="w-full pl-9 pr-4 py-2 text-xs border border-slate-200 rounded-xl focus:outline-none focus:ring-1 focus:ring-emerald-500"
            oninput="filtrarInventario(this.value)"
          />
        </div>
        <button onclick="abrirModalNuevoMedicamento()" class="bg-emerald-600 hover:bg-emerald-700 text-white text-xs font-bold px-4 py-2.5 rounded-xl shadow flex items-center space-x-1.5 transition">
          <i data-lucide="plus" class="w-4 h-4"></i>
          <span>Nuevo Medicamento</span>
        </button>
      </div>

      <div class="overflow-x-auto">
        <table class="w-full text-left text-xs border-collapse">
          <thead>
            <tr class="bg-slate-50 text-slate-500 border-b border-slate-200">
              <th class="py-3 px-3">Código</th>
              <th class="py-3 px-3">Medicamento / Presentación</th>
              <th class="py-3 px-3">Droga</th>
              <th class="py-3 px-3">Tipo</th>
              <th class="py-3 px-3">Precio ($)</th>
              <th class="py-3 px-3">Stock</th>
              <th class="py-3 px-3 text-right">Acciones</th>
            </tr>
          </thead>
          <tbody id="tbody-inventario" class="divide-y divide-slate-100">
            <!-- Filas dinámicas -->
          </tbody>
        </table>
      </div>
    </div>

    <!-- TAB 3: B2B -->
    <div id="tab-b2b" class="hidden space-y-4">
      <div id="grid-b2b" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
        <!-- Tarjetas de pedidos B2B dinámicas -->
      </div>
    </div>

  </main>

  <!-- Modal Nuevo Medicamento -->
  <div id="modal-nuevo-med" class="fixed inset-0 bg-black/40 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden">
    <div class="bg-white rounded-2xl shadow-2xl w-full max-w-lg overflow-hidden p-6 space-y-4">
      <div class="flex justify-between items-center border-b pb-3">
        <h3 class="font-bold text-base text-slate-900">Agregar Nuevo Medicamento</h3>
        <button onclick="cerrarModalNuevoMedicamento()" class="text-slate-400 hover:text-slate-700">
          <i data-lucide="x" class="w-5 h-5"></i>
        </button>
      </div>

      <form id="form-nuevo-med" onsubmit="guardarNuevoMedicamento(event)" class="space-y-3 text-xs">
        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block font-semibold text-slate-600 mb-1">Nombre Comercial</label>
            <input required id="nm-nombre" type="text" placeholder="Ej: Bayaspirina 500mg" class="w-full border p-2 rounded-lg" />
          </div>
          <div>
            <label class="block font-semibold text-slate-600 mb-1">Principio Activo (Droga)</label>
            <input required id="nm-droga" type="text" placeholder="Ej: Ácido Acetilsalicílico" class="w-full border p-2 rounded-lg" />
          </div>
        </div>

        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block font-semibold text-slate-600 mb-1">Presentación</label>
            <input required id="nm-presentacion" type="text" placeholder="Ej: Caja x 20 comp" class="w-full border p-2 rounded-lg" />
          </div>
          <div>
            <label class="block font-semibold text-slate-600 mb-1">Laboratorio</label>
            <input required id="nm-lab" type="text" placeholder="Ej: Bayer" class="w-full border p-2 rounded-lg" />
          </div>
        </div>

        <div class="grid grid-cols-3 gap-3">
          <div>
            <label class="block font-semibold text-slate-600 mb-1">Precio ($)</label>
            <input required id="nm-precio" type="number" step="0.5" placeholder="3500" class="w-full border p-2 rounded-lg" />
          </div>
          <div>
            <label class="block font-semibold text-slate-600 mb-1">Stock</label>
            <input required id="nm-stock" type="number" placeholder="20" class="w-full border p-2 rounded-lg" />
          </div>
          <div>
            <label class="block font-semibold text-slate-600 mb-1">¿Requiere Receta?</label>
            <select id="nm-receta" class="w-full border p-2 rounded-lg bg-white">
              <option value="false">Venta Libre</option>
              <option value="true">Bajo Receta</option>
            </select>
          </div>
        </div>

        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block font-semibold text-slate-600 mb-1">Concentración</label>
            <input id="nm-concentracion" type="text" placeholder="Ej: 500mg, 1g, etc." class="w-full border p-2 rounded-lg" />
          </div>
          <div>
            <label class="block font-semibold text-slate-600 mb-1">Tipo de Producto</label>
            <select id="nm-generico" class="w-full border p-2 rounded-lg bg-white font-semibold">
              <option value="false">🏷️ Marca Comercial / Líder</option>
              <option value="true">🟢 Medicamento Genérico</option>
            </select>
          </div>
        </div>

        <div>
          <label class="block font-semibold text-slate-600 mb-1">Categoría</label>
          <input required id="nm-categoria" type="text" placeholder="Ej: Analgésicos" class="w-full border p-2 rounded-lg" />
        </div>

        <div class="pt-3 border-t flex justify-end space-x-2">
          <button type="button" onclick="cerrarModalNuevoMedicamento()" class="px-4 py-2 border rounded-xl font-semibold text-slate-600">Cancelar</button>
          <button type="submit" class="px-4 py-2 bg-emerald-600 hover:bg-emerald-700 text-white rounded-xl font-bold shadow">Guardar Medicamento</button>
        </div>
      </form>
    </div>
  </div>

  <script>
    let pedidos = [];
    let medicamentos = [];
    let pedidosB2B = [];

    async function cargarTodo() {
      await Promise.all([cargarPedidos(), cargarMedicamentos(), cargarPedidosB2B()]);
      if (window.lucide && typeof window.lucide.createIcons === 'function') {
        window.lucide.createIcons();
      }
    }

    async function cargarPedidosB2B() {
      try {
        const res = await fetch('/api/drogueria/pedidos');
        if (res.ok) {
          pedidosB2B = await res.json();
          renderPedidosB2B();
        } else {
          renderPedidosB2BPlaceholder();
        }
      } catch (e) {
        console.error("Error al cargar pedidos B2B:", e);
        renderPedidosB2BPlaceholder();
      }
    }

    async function cargarPedidos() {
      try {
        const res = await fetch('/api/pedidos');
        pedidos = await res.json();
        renderKPIs();
        renderPedidos();
      } catch (e) {
        console.error("Error al cargar pedidos:", e);
      }
    }

    async function cargarMedicamentos() {
      try {
        const res = await fetch('/api/medicamentos');
        medicamentos = await res.json();
        renderInventario(medicamentos);
      } catch (e) {
        console.error("Error al cargar inventario:", e);
      }
    }

    function renderKPIs() {
      document.getElementById('stat-total').innerText = pedidos.length;
      document.getElementById('stat-pendientes').innerText = pedidos.filter(p => p.estado === 'pendiente').length;
      document.getElementById('stat-listos').innerText = pedidos.filter(p => p.estado === 'listo').length;
      
      const facturado = pedidos.reduce((acc, p) => acc + (p.total_final || 0), 0);
      document.getElementById('stat-facturado').innerText = `$${facturado.toLocaleString('es-AR')}`;
    }

    function renderPedidos() {
      const container = document.getElementById('grid-pedidos');
      if (pedidos.length === 0) {
        container.innerHTML = `<div class="col-span-full text-center py-12 text-slate-400">No hay pedidos registrados en mostrador.</div>`;
        return;
      }

      container.innerHTML = pedidos.map(p => {
        const estadoStyles = {
          'pendiente': 'bg-amber-100 text-amber-800 border-amber-200',
          'preparando': 'bg-blue-100 text-blue-800 border-blue-200',
          'listo': 'bg-emerald-100 text-emerald-800 border-emerald-200',
          'entregado': 'bg-slate-100 text-slate-600 border-slate-200'
        }[p.estado] || 'bg-slate-100 text-slate-700';

        const estadoNombre = {
          'pendiente': '🟡 Pendiente',
          'preparando': '🟠 En Preparación',
          'listo': '🟢 Listo p/ Retiro',
          'entregado': '✅ Entregado'
        }[p.estado] || p.estado;

        return `
          <div class="bg-white rounded-2xl p-4 shadow-sm border border-slate-200 flex flex-col justify-between space-y-3">
            <div>
              <div class="flex items-center justify-between mb-2">
                <span class="text-xs font-black text-slate-900">${p.id}</span>
                <span class="text-[11px] font-bold px-2 py-0.5 rounded-full border ${estadoStyles}">${estadoNombre}</span>
              </div>

              <div class="flex items-center space-x-1.5 text-xs font-bold text-slate-800">
                <i data-lucide="user" class="w-3.5 h-3.5 text-slate-400"></i>
                <span>${p.cliente_nombre}</span>
              </div>
              ${p.cliente_telefono ? `<p class="text-[11px] text-slate-400 ml-5 font-mono">📱 ${p.cliente_telefono}</p>` : ''}
              <p class="text-[10px] text-slate-400 ml-5">${p.fecha}</p>

              ${p.obra_social && !p.obra_social.includes('Particular') ? `
                <div class="mt-2 text-[11px] bg-sky-50 text-sky-800 border border-sky-100 rounded-lg p-1.5 font-medium">
                  🏥 <b>Obra Social:</b> ${p.obra_social}
                </div>
              ` : ''}

              <!-- Detalle de medicamentos -->
              <div class="mt-3 bg-slate-50 p-2.5 rounded-xl space-y-1 text-xs">
                ${p.items.map(item => `
                  <div class="flex justify-between items-center text-slate-700">
                    <span>• <b>${item.cantidad}x</b> ${item.nombre}</span>
                    <span class="font-mono text-slate-500">$${item.subtotal.toLocaleString('es-AR')}</span>
                  </div>
                `).join('')}
              </div>

              ${p.descuento_obra_social > 0 ? `
                <div class="mt-1 flex justify-between text-[11px] text-emerald-600 px-1 font-semibold">
                  <span>Desc. Obra Social:</span>
                  <span>-$${p.descuento_obra_social.toLocaleString('es-AR')}</span>
                </div>
              ` : ''}

              <div class="mt-2 pt-2 border-t flex justify-between items-center font-extrabold text-sm text-slate-900 px-1">
                <span>Total Final:</span>
                <span class="text-emerald-700 text-base">$${p.total_final.toLocaleString('es-AR')}</span>
              </div>

              ${p.requiere_receta ? `
                <div class="mt-2 bg-red-50 text-red-700 text-[10px] font-bold p-1.5 rounded-lg border border-red-100 flex items-center space-x-1">
                  <i data-lucide="alert-circle" class="w-3.5 h-3.5"></i>
                  <span>Exige receta física / validación médica</span>
                </div>
              ` : ''}
            </div>

            <!-- Botones de Acción -->
            <div class="pt-2 border-t grid grid-cols-2 gap-2 text-xs font-semibold">
              ${p.estado === 'pendiente' ? `
                <button onclick="cambiarEstado('${p.id}', 'preparando')" class="col-span-2 bg-amber-500 hover:bg-amber-600 text-white py-2 rounded-xl transition flex items-center justify-center space-x-1">
                  <i data-lucide="package" class="w-4 h-4"></i>
                  <span>Preparar Medicamentos</span>
                </button>
              ` : ''}

              ${p.estado === 'preparando' ? `
                <button onclick="cambiarEstadoYNotificar('${p.id}', 'listo', '${p.cliente_telefono}', '${p.cliente_nombre}', ${p.total_final})" class="col-span-2 bg-emerald-600 hover:bg-emerald-700 text-white py-2 rounded-xl transition flex items-center justify-center space-x-1">
                  <i data-lucide="send" class="w-4 h-4"></i>
                  <span>Marcar Listo & Avisar por WA</span>
                </button>
              ` : ''}

              ${p.estado === 'listo' ? `
                <button onclick="cambiarEstado('${p.id}', 'entregado')" class="col-span-2 bg-slate-800 hover:bg-slate-900 text-white py-2 rounded-xl transition flex items-center justify-center space-x-1">
                  <i data-lucide="check" class="w-4 h-4"></i>
                  <span>Marcar Entregado & Cobrado</span>
                </button>
              ` : ''}
            </div>
          </div>
        `;
      }).join('');
      
      lucide.createIcons();
    }

    async function cambiarEstado(id, nuevoEstado) {
      await fetch(`/api/pedidos/${id}/estado`, {
        method: 'PATCH',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ estado: nuevoEstado })
      });
      cargarPedidos();
    }

    async function cambiarEstadoYNotificar(id, nuevoEstado, telefono, cliente, total) {
      const res = await fetch(`/api/pedidos/${id}/estado`, {
        method: 'PATCH',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ estado: nuevoEstado })
      });
      const data = await res.json();
      
      if (data.mensaje_notificacion) {
        const textoEnc = encodeURIComponent(data.mensaje_notificacion);
        const telEnc = telefono ? telefono.replace(/[^0-9]/g, '') : '';
        window.open(`https://wa.me/${telEnc}?text=${textoEnc}`, '_blank');
      }
      cargarPedidos();
    }

    // TAB 2: INVENTARIO
    function renderInventario(lista) {
      const tbody = document.getElementById('tbody-inventario');
      tbody.innerHTML = lista.map(m => `
        <tr class="hover:bg-slate-50 transition">
          <td class="py-2.5 px-3 font-mono font-bold text-slate-500">${m.id}</td>
          <td class="py-2.5 px-3">
            <b class="text-slate-900">${m.nombre_comercial}</b>
            <p class="text-[10px] text-slate-400">${m.presentacion} • ${m.laboratorio}</p>
          </td>
          <td class="py-2.5 px-3">
            <span class="text-slate-800 font-medium">${m.principio_activo}</span>
            ${m.concentracion ? `<span class="text-[10px] text-slate-400 block">${m.concentracion}</span>` : ''}
          </td>
          <td class="py-2.5 px-3">
            <div class="flex flex-col gap-1 items-start">
              <span class="text-[10px] font-bold px-2 py-0.5 rounded-full ${m.es_generico ? 'bg-emerald-100 text-emerald-800 border border-emerald-200' : 'bg-slate-100 text-slate-700 border border-slate-200'}">
                ${m.es_generico ? '🟢 Genérico' : '🏷️ Marca Líder'}
              </span>
              <span class="text-[10px] font-bold px-1.5 py-0.5 rounded-full ${m.requiere_receta ? 'bg-red-50 text-red-700' : 'bg-green-50 text-green-700'}">
                ${m.requiere_receta ? 'Bajo Receta' : 'Venta Libre'}
              </span>
            </div>
          </td>
          <td class="py-2.5 px-3 font-bold">
            <input 
              type="number" 
              value="${m.precio}" 
              class="w-24 border rounded px-1.5 py-0.5 text-xs font-bold" 
              onchange="actualizarPrecioStock('${m.id}', this.value, null)"
            />
          </td>
          <td class="py-2.5 px-3 font-bold">
            <input 
              type="number" 
              value="${m.stock}" 
              class="w-16 border rounded px-1.5 py-0.5 text-xs text-center" 
              onchange="actualizarPrecioStock('${m.id}', null, this.value)"
            />
          </td>
          <td class="py-2.5 px-3 text-right">
            <button onclick="eliminarMedicamento('${m.id}')" class="text-red-500 hover:text-red-700 p-1">
              <i data-lucide="trash-2" class="w-4 h-4"></i>
            </button>
          </td>
        </tr>
      `).join('');
      if (window.lucide && typeof window.lucide.createIcons === 'function') {
        window.lucide.createIcons();
      }
    }

    async function actualizarPrecioStock(id, precio, stock) {
      const payload = {};
      if (precio !== null) payload.precio = parseFloat(precio);
      if (stock !== null) payload.stock = parseInt(stock);

      await fetch(`/api/medicamentos/${id}`, {
        method: 'PATCH',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      });
    }

    async function eliminarMedicamento(id) {
      if (!confirm(`¿Eliminar medicamento ${id}?`)) return;
      await fetch(`/api/medicamentos/${id}`, { method: 'DELETE' });
      cargarMedicamentos();
    }

    function filtrarInventario(term) {
      const q = term.toLowerCase();
      const filtrados = medicamentos.filter(m => 
        m.nombre_comercial.toLowerCase().includes(q) || 
        m.principio_activo.toLowerCase().includes(q) ||
        m.id.toLowerCase().includes(q)
      );
      renderInventario(filtrados);
    }

    function cambiarTab(tab) {
      const tabPedidos = document.getElementById('tab-pedidos');
      const tabInventario = document.getElementById('tab-inventario');
      const tabB2B = document.getElementById('tab-b2b');
      
      const btnP = document.getElementById('tab-btn-pedidos');
      const btnI = document.getElementById('tab-btn-inventario');
      const btnB2B = document.getElementById('tab-btn-b2b');

      // Reset tabs
      tabPedidos.classList.add('hidden');
      tabInventario.classList.add('hidden');
      tabB2B.classList.add('hidden');
      
      // Reset buttons
      btnP.classList.remove('border-emerald-600', 'text-emerald-600');
      btnP.classList.add('border-transparent', 'text-slate-500');
      btnI.classList.remove('border-emerald-600', 'text-emerald-600');
      btnI.classList.add('border-transparent', 'text-slate-500');
      btnB2B.classList.remove('border-emerald-600', 'text-emerald-600');
      btnB2B.classList.add('border-transparent', 'text-slate-500');

      if (tab === 'pedidos') {
        tabPedidos.classList.remove('hidden');
        btnP.classList.add('border-emerald-600', 'text-emerald-600');
        btnP.classList.remove('border-transparent', 'text-slate-500');
      } else if (tab === 'inventario') {
        tabInventario.classList.remove('hidden');
        btnI.classList.add('border-emerald-600', 'text-emerald-600');
        btnI.classList.remove('border-transparent', 'text-slate-500');
      } else if (tab === 'b2b') {
        tabB2B.classList.remove('hidden');
        btnB2B.classList.add('border-emerald-600', 'text-emerald-600');
        btnB2B.classList.remove('border-transparent', 'text-slate-500');
      }
    }

    function renderPedidosB2BPlaceholder() {
      document.getElementById('grid-b2b').innerHTML = `<div class="col-span-full text-center py-12 text-slate-400">Próximamente: Vista de pedidos B2B</div>`;
    }

    function renderPedidosB2B() {
      const container = document.getElementById('grid-b2b');
      if (pedidosB2B.length === 0) {
        container.innerHTML = `<div class="col-span-full text-center py-12 text-slate-400">No hay pedidos B2B registrados.</div>`;
        return;
      }

      container.innerHTML = pedidosB2B.map(p => {
        const estadoStyles = {
          'pendiente_aprobacion': 'bg-amber-100 text-amber-800 border-amber-200',
          'aprobado': 'bg-blue-100 text-blue-800 border-blue-200',
          'despachado': 'bg-emerald-100 text-emerald-800 border-emerald-200',
        }[p.estado] || 'bg-slate-100 text-slate-700';

        const estadoNombre = {
          'pendiente_aprobacion': '🟡 Pendiente Aprobación',
          'aprobado': '🟠 Aprobado',
          'despachado': '🟢 Despachado',
        }[p.estado] || p.estado;

        return `
          <div class="bg-white rounded-2xl p-4 shadow-sm border border-slate-200 flex flex-col justify-between space-y-3">
            <div>
              <div class="flex items-center justify-between mb-2">
                <span class="text-xs font-black text-slate-900">${p.id}</span>
                <span class="text-[11px] font-bold px-2 py-0.5 rounded-full border ${estadoStyles}">${estadoNombre}</span>
              </div>

              <div class="flex items-center space-x-1.5 text-xs font-bold text-slate-800">
                <i data-lucide="building-2" class="w-3.5 h-3.5 text-slate-400"></i>
                <span>${p.farmacia_nombre}</span>
              </div>
              <p class="text-[11px] text-slate-400 ml-5 font-mono">CUIT: ${p.cuit}</p>
              <p class="text-[11px] text-slate-400 ml-5">DT: ${p.director_tecnico}</p>
              <p class="text-[10px] text-slate-400 ml-5">${p.fecha}</p>

              <!-- Detalle de medicamentos -->
              <div class="mt-3 bg-slate-50 p-2.5 rounded-xl space-y-1 text-xs">
                ${p.items.map(item => `
                  <div class="flex justify-between items-center text-slate-700">
                    <span>• <b>${item.cantidad}x</b> ${item.nombre}</span>
                    <span class="font-mono text-slate-500">$${item.subtotal.toLocaleString('es-AR')}</span>
                  </div>
                `).join('')}
              </div>

              <div class="mt-2 pt-2 border-t flex justify-between items-center font-extrabold text-sm text-slate-900 px-1">
                <span>Total Mayorista:</span>
                <span class="text-emerald-700 text-base">$${(p.total_mayorista || 0).toLocaleString('es-AR')}</span>
              </div>
              
              ${p.requiere_frio ? `
                <div class="mt-2 bg-cyan-50 text-cyan-700 text-[10px] font-bold p-1.5 rounded-lg border border-cyan-100 flex items-center space-x-1">
                  <i data-lucide="snowflake" class="w-3.5 h-3.5"></i>
                  <span>Requiere Cadena de Frío</span>
                </div>
              ` : ''}
            </div>
          </div>
        `;
      }).join('');
      
      if (window.lucide && typeof window.lucide.createIcons === 'function') {
        window.lucide.createIcons();
      }
    }

    // Modal nuevo medicamento
    function abrirModalNuevoMedicamento() { document.getElementById('modal-nuevo-med').classList.remove('hidden'); }
    function cerrarModalNuevoMedicamento() { document.getElementById('modal-nuevo-med').classList.add('hidden'); }

    async function guardarNuevoMedicamento(e) {
      e.preventDefault();
      const body = {
        nombre_comercial: document.getElementById('nm-nombre').value,
        principio_activo: document.getElementById('nm-droga').value,
        concentracion: document.getElementById('nm-concentracion').value,
        presentacion: document.getElementById('nm-presentacion').value,
        laboratorio: document.getElementById('nm-lab').value,
        precio: parseFloat(document.getElementById('nm-precio').value),
        stock: parseInt(document.getElementById('nm-stock').value),
        requiere_receta: document.getElementById('nm-receta').value === 'true',
        es_generico: document.getElementById('nm-generico').value === 'true',
        categoria: document.getElementById('nm-categoria').value
      };

      await fetch('/api/medicamentos', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(body)
      });

      cerrarModalNuevoMedicamento();
      document.getElementById('form-nuevo-med').reset();
      cargarMedicamentos();
    }

    window.addEventListener('DOMContentLoaded', () => {
      cargarTodo();
      // Auto-refrescar cada 10 segundos
      setInterval(cargarPedidos, 10000);
    });
  </script>
</body>
</html>
