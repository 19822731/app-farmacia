version: '3.8'

services:
  # Base de Datos PostgreSQL para Typebot y catálogo persistente
  postgres:
    image: postgres:15-alpine
    container_name: farmacia_postgres
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-typebot}
      POSTGRES_USER: ${POSTGRES_USER:-typebot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-typebotpassword}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - farmacia_net

  # Cache Redis para Evolution API (mejora rendimiento y sesiones de WhatsApp)
  redis:
    image: redis:7-alpine
    container_name: farmacia_redis
    restart: always
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    networks:
      - farmacia_net

  # Evolution API v2 - Conexión con WhatsApp
  evolution-api:
    image: atendai/evolution-api:v2.1.2
    container_name: farmacia_evolution_api
    restart: always
    ports:
      - "8080:8080"
    environment:
      - SERVER_URL=http://localhost:8080
      - AUTHENTICATION_API_KEY=${EVOLUTION_API_KEY:-farmacia_secret_key_2026}
      - DATABASE_ENABLED=true
      - DATABASE_CONNECTION_URI=postgresql://${POSTGRES_USER:-typebot}:${POSTGRES_PASSWORD:-typebotpassword}@postgres:5432/${POSTGRES_DB:-typebot}?schema=evolution
      - REDIS_ENABLED=true
      - REDIS_URI=redis://redis:6379
      - CACHE_REDIS_ENABLED=true
      - CACHE_REDIS_URI=redis://redis:6379
      - TYPEBOT_ENABLED=true
    volumes:
      - evolution_instances:/evolution/instances
    depends_on:
      - postgres
      - redis
    networks:
      - farmacia_net

  # Typebot Builder - Interfaz visual de diseño de flujos
  typebot-builder:
    image: baptistearno/typebot-builder:latest
    container_name: farmacia_typebot_builder
    restart: always
    ports:
      - "3000:3000"
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-typebot}:${POSTGRES_PASSWORD:-typebotpassword}@postgres:5432/${POSTGRES_DB:-typebot}
      - NEXTAUTH_URL=http://localhost:3000
      - NEXT_PUBLIC_VIEWER_URL=http://localhost:3001
      - ENCRYPTION_SECRET=${ENCRYPTION_SECRET:-un_secreto_muy_seguro_y_largo_de_32_caracteres_minimo}
      - DEFAULT_WORKSPACE_PLAN=UNLIMITED
    depends_on:
      - postgres
    networks:
      - farmacia_net

  # Typebot Viewer - Motor de ejecución de las conversaciones
  typebot-viewer:
    image: baptistearno/typebot-viewer:latest
    container_name: farmacia_typebot_viewer
    restart: always
    ports:
      - "3001:3000"
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-typebot}:${POSTGRES_PASSWORD:-typebotpassword}@postgres:5432/${POSTGRES_DB:-typebot}
      - NEXT_PUBLIC_VIEWER_URL=http://localhost:3001
      - ENCRYPTION_SECRET=${ENCRYPTION_SECRET:-un_secreto_muy_seguro_y_largo_de_32_caracteres_minimo}
    depends_on:
      - postgres
    networks:
      - farmacia_net

volumes:
  postgres_data:
  redis_data:
  evolution_instances:

networks:
  farmacia_net:
    driver: bridge
